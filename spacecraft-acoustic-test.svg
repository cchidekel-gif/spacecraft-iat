<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">Spacecraft acoustic testing at a glance</title>
  <desc id="desc">A reverberant acoustic chamber surrounds a stowed spacecraft with sound arriving from many directions. Supporting panels explain the OASPL and one-third-octave test definition, which hardware is most responsive, and why testing the integrated launch configuration matters.</desc>

  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #17233c; }
    .title { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { font-size: 17px; fill: #53627a; }
    .section { font-size: 20px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 650; }
    .body { font-size: 15px; fill: #53627a; }
    .small { font-size: 13px; fill: #53627a; }
    .micro { font-size: 12px; fill: #53627a; }
    .number { font-size: 28px; font-weight: 750; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .thin { fill: none; stroke: #cbd5e1; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .axis { fill: none; stroke: #53627a; stroke-width: 1.3; vector-effect: non-scaling-stroke; }
  </style>

  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1769aa"/>
    </marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c75916"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="960" fill="#f7fafc"/>

  <text x="55" y="58" class="title">Spacecraft acoustic testing at a glance</text>
  <text x="55" y="88" class="subtitle">A controlled, launch-like sound field loads the whole vehicle from many directions.</text>

  <!-- Main chamber cutaway -->
  <rect x="55" y="120" width="1090" height="390" rx="16" class="panel" filter="url(#soft-shadow)"/>
  <text x="85" y="158" class="section">Reverberant acoustic chamber</text>
  <text x="85" y="182" class="body">Hard walls repeatedly reflect sound, producing a reasonably uniform diffuse field.</text>

  <!-- Reflective chamber boundary -->
  <path d="M82 205 H1118 V480 H82 Z" fill="#dceefb" fill-opacity="0.34" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M95 218 H1105 M95 467 H1105 M95 218 V467 M1105 218 V467" stroke="#1769aa" stroke-opacity="0.36" stroke-width="4" stroke-dasharray="18 10" fill="none"/>

  <!-- Horns -->
  <g aria-label="High-power acoustic horns">
    <path d="M112 292 L172 268 L172 338 L112 314 Z" fill="#c75916"/>
    <rect x="91" y="295" width="25" height="16" rx="3" fill="#c75916"/>
    <path d="M1088 397 L1028 373 L1028 443 L1088 419 Z" fill="#c75916"/>
    <rect x="1084" y="400" width="25" height="16" rx="3" fill="#c75916"/>
    <text x="90" y="363" class="label" fill="#c75916">Acoustic horns</text>
    <text x="90" y="383" class="small">or modulated nitrogen</text>
  </g>

  <!-- Sound paths and reflections -->
  <g fill="none" stroke="#1769aa" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)" opacity="0.92">
    <path d="M180 284 Q340 225 501 307"/>
    <path d="M181 310 Q350 350 500 344"/>
    <path d="M180 328 Q320 450 514 387"/>
    <path d="M1022 390 Q868 305 699 332"/>
    <path d="M1022 417 Q862 457 704 390"/>
    <path d="M780 225 Q708 267 669 310"/>
    <path d="M397 458 Q475 412 526 392"/>
  </g>
  <g fill="none" stroke="#1769aa" stroke-width="2" stroke-dasharray="7 8" opacity="0.65">
    <path d="M284 230 Q224 272 272 315"/>
    <path d="M900 229 Q969 271 922 328"/>
    <path d="M822 463 Q890 422 849 376"/>
  </g>

  <!-- Spacecraft in stowed launch configuration -->
  <g aria-label="Spacecraft in stowed launch configuration">
    <ellipse cx="600" cy="449" rx="111" ry="15" fill="#17233c" opacity="0.10"/>
    <rect x="537" y="286" width="126" height="118" rx="12" fill="#ffffff" stroke="#17233c" stroke-width="3"/>
    <path d="M548 286 L568 252 H632 L652 286" fill="#eeeafd" stroke="#17233c" stroke-width="3"/>
    <circle cx="600" cy="269" r="9" fill="#6450a6"/>
    <rect x="565" y="311" width="70" height="55" rx="7" fill="#eeeafd" stroke="#6450a6" stroke-width="2"/>
    <path d="M600 311 V366 M565 338 H635" stroke="#6450a6" stroke-width="2"/>
    <path d="M537 309 H507 V389 H537 M663 309 H693 V389 H663" fill="#e3f4ed" stroke="#24735b" stroke-width="3"/>
    <path d="M517 315 V383 M683 315 V383" stroke="#24735b" stroke-width="2"/>
    <path d="M553 404 L532 441 H668 L647 404" fill="#ffffff" stroke="#17233c" stroke-width="3"/>
    <text x="600" y="426" text-anchor="middle" class="label">Spacecraft</text>
  </g>

  <g>
    <rect x="785" y="250" width="270" height="82" rx="10" fill="#ffffff" stroke="#1769aa" stroke-width="2"/>
    <text x="805" y="278" class="label">Diffuse sound field</text>
    <text x="805" y="301" class="body">Pressure fluctuations arrive</text>
    <text x="805" y="322" class="body">from many directions.</text>
  </g>

  <g>
    <rect x="205" y="400" width="238" height="54" rx="10" fill="#fff0e4"/>
    <text x="224" y="424" class="label" fill="#c75916">Launch environment simulated</text>
    <text x="224" y="445" class="small">exhaust plume + pad interaction</text>
  </g>

  <!-- Bottom panel 1: test definition -->
  <rect x="55" y="535" width="346" height="340" rx="16" class="panel"/>
  <text x="80" y="570" class="section">1  Define the environment</text>
  <text x="80" y="608" class="number" fill="#1769aa">140–142 dB</text>
  <text x="80" y="631" class="small">typical spacecraft-level OASPL range</text>

  <g transform="translate(81 654)" aria-label="Illustrative one-third-octave spectrum with greater energy at lower frequencies">
    <path d="M0 111 V0 M0 111 H286" class="axis"/>
    <text x="-8" y="10" class="micro" text-anchor="end">SPL</text>
    <text x="286" y="130" class="micro" text-anchor="end">frequency →</text>
    <g fill="#1769aa" opacity="0.86">
      <rect x="15" y="18" width="18" height="93" rx="2"/>
      <rect x="40" y="8" width="18" height="103" rx="2"/>
      <rect x="65" y="23" width="18" height="88" rx="2"/>
      <rect x="90" y="31" width="18" height="80" rx="2"/>
      <rect x="115" y="43" width="18" height="68" rx="2"/>
      <rect x="140" y="50" width="18" height="61" rx="2"/>
      <rect x="165" y="61" width="18" height="50" rx="2"/>
      <rect x="190" y="69" width="18" height="42" rx="2"/>
      <rect x="215" y="78" width="18" height="33" rx="2"/>
      <rect x="240" y="88" width="18" height="23" rx="2"/>
    </g>
    <path d="M24 15 H100" stroke="#c75916" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="107" y="18" class="micro" fill="#c75916">strong low-frequency energy</text>
  </g>
  <text x="80" y="792" class="micro">Illustrative only — use the specified ⅓-octave spectrum.</text>

  <!-- Bottom panel 2: susceptibility -->
  <rect x="427" y="535" width="346" height="340" rx="16" class="panel"/>
  <text x="452" y="570" class="section">2  Match test to hardware</text>
  <text x="452" y="601" class="body">Response tends to increase with:</text>
  <g transform="translate(452 624)">
    <rect x="0" y="0" width="296" height="48" rx="9" fill="#fff0e4"/>
    <text x="17" y="29" class="label">large area • low mass • low stiffness</text>
    <text x="0" y="91" class="label" fill="#c75916">Often more responsive</text>
    <text x="0" y="116" class="body">solar arrays • antenna reflectors</text>
    <text x="0" y="138" class="body">instrument baffles</text>
    <path d="M0 163 H295" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="0" y="190" class="label" fill="#24735b">Often less direct response</text>
    <text x="0" y="214" class="body">compact, stiff electronics boxes</text>
  </g>

  <!-- Bottom panel 3: system configuration -->
  <rect x="799" y="535" width="346" height="340" rx="16" class="panel"/>
  <text x="824" y="570" class="section">3  Test the launch configuration</text>
  <g transform="translate(824 602)">
    <rect x="0" y="0" width="296" height="54" rx="10" fill="#e3f4ed"/>
    <text x="17" y="24" class="label">Appendages match ascent state</text>
    <text x="17" y="44" class="small">usually stowed; deployed only if applicable</text>

    <path d="M27 90 H270" stroke="#6450a6" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <circle cx="27" cy="90" r="9" fill="#6450a6"/>
    <circle cx="147" cy="90" r="9" fill="#6450a6"/>
    <circle cx="270" cy="90" r="9" fill="#6450a6"/>
    <text x="27" y="119" class="small" text-anchor="middle">external</text>
    <text x="27" y="137" class="small" text-anchor="middle">shape</text>
    <text x="147" y="119" class="small" text-anchor="middle">structural</text>
    <text x="147" y="137" class="small" text-anchor="middle">paths</text>
    <text x="270" y="119" class="small" text-anchor="middle">component</text>
    <text x="270" y="137" class="small" text-anchor="middle">response</text>

    <text x="0" y="177" class="body">Integrated testing can reveal interactions</text>
    <text x="0" y="199" class="body">that isolated component tests may miss.</text>
  </g>

  <text x="55" y="925" class="small">Test levels, duration, tolerances, configuration, and instrumentation must come from the program-specific test specification and launch-environment analysis.</text>
</svg>
